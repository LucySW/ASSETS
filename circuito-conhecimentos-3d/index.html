<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Circuito de Conhecimentos 3D</title>
<style>
:root{
  --bg:#dfeaf3; --panel:rgba(255,255,255,.88); --text:#1d232b; --muted:#56606c;
  --line:rgba(0,0,0,.12); --btn:#f2f4f6; --btn-hover:#e3e8ee; --accent:#1f5aa6; --accent-text:#fff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141a; --panel:rgba(20,24,30,.86); --text:#eef1f4; --muted:#a8b0ba;
    --line:rgba(255,255,255,.14); --btn:#232a33; --btn-hover:#2e3742; --accent:#5b9bec; --accent-text:#0b1220; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10141a; --panel:rgba(20,24,30,.86); --text:#eef1f4; --muted:#a8b0ba;
  --line:rgba(255,255,255,.14); --btn:#232a33; --btn-hover:#2e3742; --accent:#5b9bec; --accent-text:#0b1220; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{display:block;touch-action:none}
#ui{position:fixed;top:calc(12px + env(safe-area-inset-top, 0px));left:12px;max-width:min(300px,calc(100vw - 32px));background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:12px;backdrop-filter:blur(8px);z-index:2}
#ui h1{font-size:15px;margin:0 0 2px}
#ui p{margin:0 0 10px;color:var(--muted);font-size:12px}
#views{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#views button,#walk,#toggle{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--btn);color:var(--text);
  border-radius:8px;padding:7px 8px;cursor:pointer;text-align:left}
#views button:hover,#toggle:hover{background:var(--btn-hover)}
#views button.on{background:var(--accent);color:var(--accent-text);border-color:transparent}
#walk{width:100%;margin-top:8px;text-align:center;background:var(--accent);color:var(--accent-text);border-color:transparent;font-weight:600}
#toggle{position:absolute;top:10px;right:10px;padding:2px 8px}
#ui.min #body{display:none}
#ui.min h1{margin-right:40px}
#hint{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom, 0px));left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:6px 14px;font-size:12px;color:var(--muted);z-index:2;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#load{position:fixed;inset:0;display:grid;place-items:center;font-size:15px;color:var(--muted);z-index:3;background:var(--bg)}
#cross{position:fixed;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.5);display:none;z-index:2}
</style>
</head>
<body>
<div id="load">Construindo o Circuito de Conhecimentos…</div>
<div id="ui">
  <h1>Circuito de Conhecimentos</h1>
  <button id="toggle" aria-label="Recolher painel">–</button>
  <div id="body">
    <p>Unimontes · FAPEMIG — maquete low poly em escala real (1 unidade = 1 m)</p>
    <div id="views"></div>
    <button id="walk">Caminhar (WASD + mouse)</button>
  </div>
</div>
<div id="cross"></div>
<div id="hint">Arraste para girar · roda/pinça para zoom · botão direito para mover</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   Coordenadas (medidas na foto aérea, em metros):
   +X = nordeste (lado do arco de entrada), -X = sudoeste (bloco 8)
   +Z = sudeste (rua com carros e prédio das varandas), -Z = noroeste
   Y = altura. O piso do Circuito fica 0,15 m acima do asfalto.
   ===================================================================== */

// ---------- utilidades ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand = mulberry32(20260930);
const R = (a,b)=>a+(b-a)*rand();
const pick = a=>a[Math.floor(rand()*a.length)];
const PI = Math.PI;

const _m=new THREE.Matrix4(), _q=new THREE.Quaternion(), _e=new THREE.Euler(), _p=new THREE.Vector3(), _s=new THREE.Vector3(), _c=new THREE.Color();

class Builder{
  constructor(){this.geos=[];this.stack=[new THREE.Matrix4()];}
  get top(){return this.stack[this.stack.length-1];}
  push(x=0,y=0,z=0,ry=0,rx=0,rz=0){
    _e.set(rx,ry,rz,'YXZ'); _q.setFromEuler(_e);
    const m=new THREE.Matrix4().compose(new THREE.Vector3(x,y,z),_q.clone(),new THREE.Vector3(1,1,1));
    this.stack.push(this.top.clone().multiply(m)); return this;
  }
  pop(){this.stack.pop();return this;}
  add(geo,color,pos=[0,0,0],rot=[0,0,0],scl=[1,1,1],jit=0){
    let g = geo.index ? geo.toNonIndexed() : geo;
    if(g!==geo) geo.dispose();
    if(g.attributes.uv) g.deleteAttribute('uv');
    _e.set(rot[0],rot[1],rot[2],'YXZ'); _q.setFromEuler(_e);
    _m.compose(_p.set(pos[0],pos[1],pos[2]),_q,_s.set(scl[0],scl[1],scl[2])).premultiply(this.top);
    g.applyMatrix4(_m);
    const n=g.attributes.position.count, c=new Float32Array(n*3);
    _c.set(color);
    for(let i=0;i<n;i+=3){
      const f = jit ? 1+(rand()*2-1)*jit : 1;
      for(let k=0;k<3&&i+k<n;k++){c[(i+k)*3]=_c.r*f;c[(i+k)*3+1]=_c.g*f;c[(i+k)*3+2]=_c.b*f;}
    }
    g.setAttribute('color',new THREE.BufferAttribute(c,3));
    this.geos.push(g); return g;
  }
  // caixa com a BASE em y (x,z = centro)
  box(w,h,d,x,y,z,color,ry=0,jit=0){return this.add(new THREE.BoxGeometry(w,h,d),color,[x,y+h/2,z],[0,ry,0],[1,1,1],jit);}
  cyl(rt,rb,h,seg,x,y,z,color,jit=0){return this.add(new THREE.CylinderGeometry(rt,rb,h,seg),color,[x,y+h/2,z],[0,0,0],[1,1,1],jit);}
  // barra entre dois pontos (seção quadrada t)
  beam(a,b,t,color){
    const d=new THREE.Vector3().subVectors(b,a), L=d.length();
    const g=new THREE.BoxGeometry(t,L,t);
    const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());
    g.applyQuaternion(q); const mid=a.clone().add(b).multiplyScalar(.5); g.translate(mid.x,mid.y,mid.z);
    return this.add(g,color);
  }
  mesh(material,{cast=true,receive=true}={}){
    const g=mergeGeometries(this.geos,false); this.geos.forEach(x=>x.dispose()); this.geos=[];
    const m=new THREE.Mesh(g,material); m.castShadow=cast; m.receiveShadow=receive; return m;
  }
}

function blobGeo(r,detail=1,amt=.16){
  const g=new THREE.IcosahedronGeometry(r,detail); const p=g.attributes.position; const map=new Map();
  for(let i=0;i<p.count;i++){
    const k=`${p.getX(i).toFixed(3)},${p.getY(i).toFixed(3)},${p.getZ(i).toFixed(3)}`;
    if(!map.has(k)) map.set(k,[R(-amt,amt)*r,R(-amt,amt)*r,R(-amt,amt)*r]);
    const o=map.get(k); p.setXYZ(i,p.getX(i)+o[0],p.getY(i)+o[1],p.getZ(i)+o[2]);
  }
  g.computeVertexNormals(); return g;
}

function canvasTex(w,h,draw,repeat=false){
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); draw(g,w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;}
  return t;
}

// ---------- cena ----------
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate=false;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog('#cfe2f1',140,480);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,2000);

const hemi=new THREE.HemisphereLight('#d6ebff','#8c7a58',1.15); scene.add(hemi);
const sun=new THREE.DirectionalLight('#fff3dc',2.6);
const SUN_TARGET=new THREE.Vector3(-5,0,-20);
sun.position.copy(SUN_TARGET).add(new THREE.Vector3(55,110,70));
sun.target.position.copy(SUN_TARGET);
sun.castShadow=true; sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-125,right:125,top:125,bottom:-125,near:10,far:400});
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.03;
scene.add(sun,sun.target);

// céu em degradê
{
  const g=new THREE.SphereGeometry(900,24,12); const p=g.attributes.position; const c=[];
  const top=new THREE.Color('#3f8fe0'), hor=new THREE.Color('#cfe6f7');
  for(let i=0;i<p.count;i++){const t=Math.max(0,p.getY(i)/900); const col=hor.clone().lerp(top,Math.pow(t,.55)); c.push(col.r,col.g,col.b);}
  g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));
  scene.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false})));
}

const MAT=new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true});
const B=new Builder();          // geometria estática (1 draw call)
const GLOW=new Builder();       // lâmpadas acesas
const SEE=new Builder();        // vidros/grades translúcidas
const CLOUD=new Builder();

// ---------- paleta ----------
const C={
  wall:'#d3d5d6', roof:'#b7bbbe', dark:'#2d2f33', glass:'#3a4a58', alu:'#c9ced3', frost:'#e2e6e9',
  concrete:'#a9aaa7', concreteL:'#bdbdb8', curb:'#e9e9e4', asphalt:'#55575a', line:'#eeeeea',
  earth:'#8a7a56', earthR:'#b58759', grass:'#6c9a3b', grassD:'#577f30', soil:'#5a4632',
  trunk:'#6a4e37', yellow:'#e9c21a', black:'#1c1d1f',
  leaf:['#4d8a2c','#5b9832','#69a63b','#3f7b28','#78ac40'],
};

// ---------- texturas ----------
const pavTex=canvasTex(512,512,(g,w)=>{
  const u=16, shades=['#cfc3ae','#c2b6a0','#d8cdb9','#b9ad98','#c9bda8','#b4a893'];
  g.fillStyle='#8e877b'; g.fillRect(0,0,w,w);
  const draw=(x,y,bw,bh)=>{g.fillStyle=pick(shades);g.fillRect(x*u+1,y*u+1,bw*u-2,bh*u-2);};
  for(let k=-70;k<70;k++)for(let s=-30;s<30;s++){
    const hx=k+2*s, hy=k-2*s;
    for(const ox of [-32,0,32])for(const oy of [-32,0,32]){
      const X=hx+ox, Y=hy+oy;
      if(X>-3&&X<34&&Y>-3&&Y<34){draw(X,Y,2,1);draw(X,Y+1,1,2);}
    }
  }
},true);
const asphTex=canvasTex(256,256,(g,w)=>{
  g.fillStyle='#8a8a8a';g.fillRect(0,0,w,w);
  for(let i=0;i<5000;i++){const v=100+Math.floor(rand()*80);g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(rand()*w,rand()*w,1.5,1.5);}
},true);
const corrTex=canvasTex(64,16,(g,w,h)=>{
  for(let x=0;x<w;x++){const v=Math.round(222+33*Math.sin(x/w*2*PI*2));g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(x,0,1,h);}
},true);

// ---------- materiais com textura ----------
const pavMat=new THREE.MeshLambertMaterial({map:pavTex});
const asphMat=new THREE.MeshLambertMaterial({map:asphTex,color:'#a3a5a9'});
const cladMats={};
function cladMat(col){return cladMats[col]||(cladMats[col]=new THREE.MeshLambertMaterial({map:corrTex,color:col}));}

function decal(tex,w,h,x,y,z,ry,opts={}){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshLambertMaterial({map:tex,transparent:!!opts.transparent,alphaTest:opts.transparent?0.4:0,side:opts.double?THREE.DoubleSide:THREE.FrontSide}));
  m.position.set(x,y,z); m.rotation.y=ry; m.receiveShadow=true; (opts.parent||scene).add(m); return m;
}
// painel de chapa ondulada (listras verticais em escala real)
function clad(col,w,h,x,y,z,ry){
  const g=new THREE.PlaneGeometry(w,h); const uv=g.attributes.uv;
  for(let i=0;i<uv.count;i++) uv.setX(i,uv.getX(i)*w/0.3);
  const m=new THREE.Mesh(g,cladMat(col)); m.position.set(x,y+h/2,z); m.rotation.y=ry; m.receiveShadow=true; scene.add(m); return m;
}
const FACE={px:PI/2,nx:-PI/2,pz:0,nz:PI};

function numberTex(txt,col){
  return canvasTex(256,320,(g,w,h)=>{
    g.clearRect(0,0,w,h); g.fillStyle=col; g.textAlign='center'; g.textBaseline='middle';
    g.font='bold 300px "Arial Rounded MT Bold","Helvetica Neue",Arial,sans-serif'; g.fillText(txt,w/2,h/2+14);
  });
}

// ---------- chão ----------
const PAV=[]; // geometrias do piso intertravado
function paved(x0,x1,z0,z1,y=0.16){
  const g=new THREE.PlaneGeometry(x1-x0,z1-z0); g.rotateX(-PI/2); g.translate((x0+x1)/2,y,(z0+z1)/2);
  const p=g.attributes.position, uv=g.attributes.uv;
  for(let i=0;i<p.count;i++) uv.setXY(i,p.getX(i)/3.2,-p.getZ(i)/3.2);
  PAV.push(g);
}
function interp(pts,x){
  if(x<=pts[0][0])return pts[0][1];
  for(let i=0;i<pts.length-1;i++){const[a,za]=pts[i],[b,zb]=pts[i+1];if(x>=a&&x<=b)return za+(zb-za)*(x-a)/(b-a);}
  return pts[pts.length-1][1];
}
// rua de saída (foto 12): parte da ponta da ilha e segue para o noroeste, 17° para a esquerda
const ROAD_TH=17*PI/180, ROAD_O=[37.5,0];
function RP(s,u){return [ROAD_O[0]-Math.sin(ROAD_TH)*s+Math.cos(ROAD_TH)*u, ROAD_O[1]-Math.cos(ROAD_TH)*s-Math.sin(ROAD_TH)*u];}
function roadBox(s0,s1,u0,u1,h,col,y=0){const [x,z]=RP((s0+s1)/2,(u0+u1)/2);B.box(u1-u0,h,s1-s0,x,y,z,col,ROAD_TH,.04);}
function roadGroup(s,u){const g=new THREE.Group();const [x,z]=RP(s,u);g.position.set(x,0,z);g.rotation.y=ROAD_TH;scene.add(g);g.updateMatrixWorld();return g;}
// contorno da ilha do Circuito (medido na aérea)
const EDGE_NW=[[-62,-4],[-46,-5.3],[-32,-8],[-25,-8.8],[-12,-9.4],[-3,-10.8],[10,-11.2],[13,-15.2],[22,-15.5],[26,-11.8],[30,-10.2],[33.5,-7]];
const EDGE_SE=[[-62,12],[-50,12.5],[-40,12],[-25,10.5],[-10,9],[0,7.5],[12,6.2],[22,5],[30,5],[33.5,3]];

// terreno geral (grama seca) e asfalto
{
  const g=new THREE.PlaneGeometry(1000,1000,50,50); g.rotateX(-PI/2);
  B.add(g,'#9c9463',[0,-0.05,0],[0,0,0],[1,1,1],.06);
  const a=new THREE.Mesh(new THREE.PlaneGeometry(175,135).rotateX(-PI/2),asphMat);
  a.position.set(-15,0.005,-30); a.receiveShadow=true; scene.add(a);
  asphTex.repeat.set(30,24);
}
// ilha elevada
{
  const pts=[...EDGE_NW,[33.5,-3],...EDGE_SE.slice().reverse()];
  const sh=new THREE.Shape(pts.map(([x,z])=>new THREE.Vector2(x,-z)));
  const g=new THREE.ExtrudeGeometry(sh,{depth:0.15,bevelEnabled:false}); g.rotateX(-PI/2);
  B.add(g,'#6f7c47',[0,0,0],[0,0,0],[1,1,1],.05);
  // meio-fio pintado de branco na frente da entrada
  B.box(0.25,0.17,10,33.45,0,0,C.curb);
}
// canteiros de terra/grama no entorno
function bed(x0,x1,z0,z1,col=C.grass,h=0.14,y=0){B.box(x1-x0,h,z1-z0,(x0+x1)/2,y,(z0+z1)/2,col,0,.08);}
bed(-62,22,-29.3,-26.4,'#6d7446');       // canteiro central do estacionamento NO
bed(-100,34,18.2,21.6,'#7d7a4c');        // faixa de árvores do outro lado da rua SE
bed(21,36,21.6,32,C.earthR);             // terra avermelhada (aérea, canto inferior direito)
bed(-100,21,32,36,'#7d7a4c');
roadBox(12,48,-6.4,-4.2,0.14,'#6d7446');     // canteiro do lado esquerdo da rua de saída
roadBox(-4,96,4.1,6.6,0.15,'#bcb8ad');       // calçada do lado direito
roadBox(-7,96,6.6,80,0.14,'#9a8f62');        // terreno atrás da calçada
bed(36,90,10,36,'#b6b2a8',0.15);         // calçada/pátio do prédio das varandas
bed(-100,-35,21.6,32,'#7d7a4c');

// ---------- piso intertravado do Circuito ----------
paved(-62,-45.4,-4.3,11.2);    // praça sudoeste (bloco 8)
paved(-45.4,-30.5,-5.2,9.6);   // módulo C (blocos 7 e 8)
paved(-31,-24.5,-7.6,9.2);     // pátio entre C e B
paved(-24.5,-10.5,-8.6,8.0);   // módulo B (blocos 4, 5, 6)
paved(-12,-2.2,-9.2,7.3);      // pátio entre B e A
paved(-2.5,11.5,-10.6,5.2);    // módulo A (blocos 1, 2, 3)
paved(11,30,-10.2,4.6);        // praça de entrada
paved(30,33.4,-7.1,-2.9);      // passagem sob o arco
{
  const g=mergeGeometries(PAV); const m=new THREE.Mesh(g,pavMat); m.receiveShadow=true; scene.add(m);
}

// ---------- piso tátil amarelo ----------
function tact(x0,z0,x1,z1,w=0.4){
  const dx=x1-x0,dz=z1-z0,L=Math.hypot(dx,dz);
  B.box(L+w,0.02,w,(x0+x1)/2,0.16,(z0+z1)/2,C.yellow,Math.atan2(-dz,dx));
}
function tactPath(pts){for(let i=0;i<pts.length-1;i++)tact(...pts[i],...pts[i+1]);}
tactPath([[33.3,-3.9],[24.6,-3.9],[24.6,0.9],[12.2,0.9]]);
tactPath([[33.3,-6.7],[24.6,-6.7],[24.6,-3.9]]);
tactPath([[12.2,0.9],[12.2,-1.4],[1.4,-1.4]]);
tactPath([[9.6,-4.6],[1.4,-4.6]]);
tactPath([[-2.4,-2.4],[-11.5,-2.4],[-11.5,1.8],[-24.5,1.8],[-27,1.8],[-27,2.6],[-45.2,2.6]]);
tactPath([[-45.6,2.6],[-60,2.6]]);
tactPath([[-27,1.8],[-27,-5.5],[-29.5,-5.5]]);
tactPath([[-60,-2.8],[-47,-2.8]]);
for(const[x,z]of[[24.6,-3.9],[24.6,0.9],[12.2,0.9],[-11.5,1.8],[-27,2.6],[33,-3.9],[33,-6.7]]) B.box(0.8,0.022,0.8,x,0.16,z,C.yellow);

// ---------- vegetação ----------
function tree(x,z,h=7,r=3.5,kind='round',y=0.15){
  const lean=R(-.08,.08);
  B.push(x,y,z,R(0,2*PI));
  B.add(new THREE.CylinderGeometry(0.16*r/3.5+0.1,0.24*r/3.5+0.14,h*0.62,6),C.trunk,[0,h*0.31,0],[lean,0,lean]);
  for(let i=0;i<3;i++){ // galhos
    const a=i*2.1+R(0,1), s=new THREE.Vector3(0,h*0.45,0), e=new THREE.Vector3(Math.cos(a)*r*.55,h*0.72,Math.sin(a)*r*.55);
    B.beam(s,e,0.14,C.trunk);
  }
  const n=kind==='flat'?7:5;
  for(let i=0;i<n;i++){
    const a=i/n*2*PI+R(0,.6), d=i===0?0:r*R(.35,.6);
    const rr=r*R(.5,.72)*(kind==='flat'?.9:1);
    const sy=kind==='flat'?0.42:R(.62,.8);

function palm(x,z,h=8,y=0.15){

const H=4.3, Y0=0.15;
function bar(o){
  const {x0,x1,z0,z1,inner}=o, L=x1-x0, D=z1-z0, cx=(x0+x1)/2, cz=(z0+z1)/2;
  const zi = inner>0? z1 : z0, s=inner;
  B.box(L,H,D,cx,Y0,cz,C.wall,0,.015);
  B.box(L-0.3,0.08,D-0.3,cx,Y0+H,cz,C.roof,0,.02);          // telhado atrás da platibanda
  for(let x=x0+1.5;x<x1-1;x+=1.1) B.box(0.05,0.05,D-0.4,x,Y0+H+0.08,cz,'#a2a6a9'); // ondas da telha
  // marquise escura (aba) que contorna a fachada interna e as pontas
  const czA = s>0 ? (z0-0.04+z1+0.9)/2 : (z0-0.9+z1+0.04)/2;
  {const ox0=o.fullClad?0:0.3; B.box(L+0.3+ox0,0.34,D+0.94,cx+(0.3-ox0)/2,3.0,czA,C.dark);}
  // vitrine de vidro na fachada interna
  const ca=o.cladW??1.6, gx0=x0+ca, gx1=x1-ca, gw=gx1-gx0;
  if(gw>1){
    B.box(gw,2.85,0.08,(gx0+gx1)/2,Y0,zi+s*0.03,C.glass);
    const n=Math.max(2,Math.round(gw/1.25));
    for(let i=0;i<=n;i++) B.box(0.07,2.85,0.12,gx0+gw*i/n,Y0,zi+s*0.05,C.alu);
    B.box(gw,0.13,0.12,(gx0+gx1)/2,Y0+1.05,zi+s*0.06,C.frost);   // faixa jateada
    B.box(gw,0.08,0.12,(gx0+gx1)/2,Y0+2.8,zi+s*0.05,C.alu);
    B.box(gw,0.08,0.12,(gx0+gx1)/2,Y0,zi+s*0.05,C.alu);
    // placa pequena ao lado da porta
    B.box(0.5,0.3,0.04,gx1+0.35,Y0+1.5,zi+s*0.03,'#f4f1e8');
    B.box(0.5,0.06,0.045,gx1+0.35,Y0+1.72,zi+s*0.035,'#e8741f');
  }
  // chapas onduladas coloridas nas duas pontas da fachada interna
  const fr = s>0?FACE.pz:FACE.nz;
  clad(o.clad,ca,2.85,x0+ca/2,Y0,zi+s*0.025,fr);
  clad(o.clad,ca,2.85,x1-ca/2,Y0,zi+s*0.025,fr);
  if(o.shutter){ B.box(1.1,2.5,0.05,x0+ca/2,Y0,zi+s*0.05,'#3a3b3d'); for(let y=0.3;y<2.6;y+=0.12) B.box(1.1,0.02,0.06,x0+ca/2,Y0+y,zi+s*0.055,'#4a4c4f'); }
  // janelas altas na fachada externa
  const zo = s>0? z0 : z1;
  for(let x=x0+2.2;x<x1-1.5;x+=3.2) B.box(1.1,0.55,0.06,x,Y0+2.2,zo-s*0.01,'#34393f');
  // câmeras de segurança
  for(const x of[x0+0.4,x1-0.4]){B.box(0.28,0.12,0.12,x,2.72,zi+s*0.35,'#f3f3f3');B.box(0.05,0.18,0.05,x,2.84,zi+s*0.3,'#f3f3f3');}
  // números
  for(const [key,face,xf] of [['numNE','px',x1],['numSW','nx',x0]]){
    const nm=o[key]; if(!nm) continue;
    decal(numberTex(nm.t,nm.c),2.0,2.5,xf+(face==='px'?0.03:-0.03),Y0+1.95,cz+(nm.dz||0),FACE[face],{transparent:true});
  }
  if(o.fullClad){ // ponta inteira revestida (bloco 8 rosa / bloco 7 azul-petróleo)
    const f=o.fullClad; const xf=f.face==='nx'?x0-0.02:x1+0.02;

    const zs = s>0? z0-0.02 : z1+0.02; // dobra na lateral externa
    clad(f.c,3,H,f.face==='nx'?x0+1.5:x1-1.5,Y0,zs,s>0?FACE.nz:FACE.pz);
  }
}

  // lado SE da ilha
  [-56,9.5,7,3.5],[-44,10.2,8,4],[-38,9.8,8.5,4.2],[-33,9.9,7.5,3.8],[-28,9.4,8,4],[-22.5,8.6,8,4.2],[-18,8.3,7,3.5],[-14.5,7.8,7.5,3.8],
  [-7,7.3,8,4.3],[-3,6.6,6,3],[6.5,5.9,7.5,4],[10.5,5.8,8,4.2],[14.8,5.2,6.5,3.2],[21,4.1,6,3],[31.6,0.9,9,4.8],
  // lado NO da ilha
  [-58,-3.2,6,3],[-36,-6.9,7,3.5],[-29.4,-8.1,7.5,3.8],[-18.6,-8.2,7,3.6],[-8,-8.6,6,3],[-4.8,-10.1,7,3.4],
  [9.2,-13.2,7.5,4],[14,-13.8,7,3.5],[18,-14.2,8,4.2],[22.6,-13,8.5,4.6],[29.2,-9.1,7,3.5],
];
for(const t of TREES) tree(...t);
// canteiro central do estacionamento NO
for(let x=-58;x<21;x+=7.5) tree(x+R(-1,1),-27.9,R(6.5,9),R(3.2,4.5));
// faixa do outro lado da rua SE
for(let x=-95;x<32;x+=7) tree(x+R(-1,1),19.9,R(6,8.5),R(3,4.2));
tree(26,23,7.5,4,'flat'); tree(32,25.5,8,4.2); tree(24.5,28.5,6.5,3.4);
// rua de saída
for(const t of[16,24,32,40]){const[x,z]=RP(t,-5.3);tree(x,z,R(7,9),R(3.5,4.5));}
{const[x,z]=RP(-1.5,5.6);tree(x,z,7.5,4.6,'flat');} for(const t of[24,34,45,56]){const[x,z]=RP(t,5.6);tree(x,z,R(7,9),R(3.5,4.5),'flat');}
// SW da praça
tree(-64,-6,8,4); tree(-66,14,7,3.6); tree(-52,15.5,6.5,3.2);
// cinturão distante
for(let i=0;i<110;i++){
  const a=R(0,2*PI), r=R(105,190), x=-5+Math.cos(a)*r, z=-20+Math.sin(a)*r*0.8;
  tree(x,z,R(7,12),R(3.5,6),rand()<.3?'flat':'round',0);
}
for(let i=0;i<10;i++) palm(R(60,95),R(-40,8),R(7,10));

// ---------- nuvens ----------
for(let i=0;i<22;i++){
  const x=R(-300,300),z=R(-320,200),y=R(70,120);
  for(let k=0;k<5;k++) CLOUD.add(blobGeo(R(6,12),0,.2),'#ffffff',[x+R(-14,14),y+R(-2,3),z+R(-8,8)],[0,R(0,3),0],[1,.55,1]);
}

// ---------- montagem ----------
scene.add(B.mesh(MAT));
scene.add(GLOW.mesh(new THREE.MeshBasicMaterial({vertexColors:true}),{cast:false,receive:false}));
scene.add(SEE.mesh(new THREE.MeshLambertMaterial({vertexColors:true,transparent:true,opacity:.35,side:THREE.DoubleSide,depthWrite:false}),{cast:false,receive:false}));
scene.add(CLOUD.mesh(new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true,emissive:'#c9d9e8',emissiveIntensity:.4,fog:false}),{cast:false,receive:false}));
renderer.shadowMap.needsUpdate=true;

// ---------- câmeras ----------
const orbit=new OrbitControls(camera,renderer.domElement);
orbit.enableDamping=true; orbit.maxPolarAngle=PI*0.495; orbit.minDistance=0.3; orbit.maxDistance=400;
const walk=new PointerLockControls(camera,document.body);

const yawLook=(p,yawDeg,y=1.9)=>{const a=yawDeg*PI/180;return[p[0]+Math.sin(a)*40,y,p[2]-Math.cos(a)*40];};
const VIEWS={
  frente:  {label:'Frente (foto 10)',     pos:[32.9,1.6,-4.6],  look:[44,2.6,-4.4],  fov:62},
  direita: {label:'Direita (foto 11)',    pos:[37.0,1.6,-2.5],  look:[45,5.5,14],    fov:62},
  esquerda:{label:'Esquerda (foto 12)',   pos:[34.2,1.6,-1.4],  look:yawLook([34.2,1.6,-1.4],-24), fov:55},
  entrada: {label:"Entrada (arco)",      pos:[37.4,1.6,-4.6],  look:[26,2.2,-5.6],  fov:58},
  panorama:{label:'Rua do arco',         pos:[37.2,1.6,1.5],   look:[20,1.8,-6],    fov:70},
  aerea:   {label:'Vista aérea',         pos:[-6,125,0.1],     look:[-6,0,0],       fov:50},
  geral:   {label:'Visão geral',         pos:[66,58,-44],      look:[-6,0,0],      fov:55},
  patio13: {label:'Blocos 1 e 3',        pos:[26.5,1.6,-0.2],  look:[0,2.2,-3],       fov:62},
  blocos45:{label:'Blocos 4 e 5',        pos:[4.5,1.6,-3.0],   look:[-14,1.8,0.8], fov:66},
  bloco8:  {label:'Bloco 8',             pos:[-61,1.6,8.5],    look:[-45,2,1.2],    fov:66},
};
let current='';
function setView(k){
  const v=VIEWS[k]; if(!v) return; current=k;
  if(walk.isLocked) walk.unlock();
  camera.fov=v.fov; camera.updateProjectionMatrix();
  camera.position.set(...v.pos); orbit.target.set(...v.look); camera.lookAt(orbit.target);
  // alvo mais perto para girar em volta do observador nas vistas de pedestre
  if(v.pos[1]<3){ const dir=new THREE.Vector3(...v.look).sub(camera.position).normalize(); orbit.target.copy(camera.position).addScaledVector(dir,0.6); }
  orbit.update();
  document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
}
window.setView=setView; window.__cam=camera; window.__V=THREE.Vector3;
const vbox=document.getElementById('views');
for(const[k,v]of Object.entries(VIEWS)){const b=document.createElement('button');b.textContent=v.label;b.dataset.k=k;b.onclick=()=>setView(k);vbox.appendChild(b);}

// caminhar
const keys={}; const hint=document.getElementById('hint'), cross=document.getElementById('cross');
document.getElementById('walk').onclick=()=>{ if(matchMedia('(pointer:coarse)').matches){hint.textContent='No celular, use os dedos para girar e aproximar';return;} camera.position.y=1.7; try{ const r=walk.lock(); if(r&&r.catch) r.catch(()=>{hint.textContent='O navegador bloqueou o modo caminhar; use o mouse para girar e aproximar';}); }catch(e){hint.textContent='O navegador bloqueou o modo caminhar; use o mouse para girar e aproximar';} };
walk.addEventListener('lock',()=>{orbit.enabled=false;cross.style.display='block';hint.textContent='W A S D para andar · Shift corre · Esc sai';});
walk.addEventListener('unlock',()=>{orbit.enabled=true;cross.style.display='none';hint.textContent='Arraste para girar · roda/pinça para zoom · botão direito para mover';
  const d=new THREE.Vector3();camera.getWorldDirection(d);orbit.target.copy(camera.position).addScaledVector(d,0.6);});
addEventListener('keydown',e=>keys[e.code]=true); addEventListener('keyup',e=>keys[e.code]=false);
document.getElementById('toggle').onclick=()=>{const u=document.getElementById('ui');u.classList.toggle('min');document.getElementById('toggle').textContent=u.classList.contains('min')?'+':'–';};
if(innerWidth<600) document.getElementById('toggle').click();

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

const clock=new THREE.Clock();
function frame(){
  const dt=Math.min(clock.getDelta(),0.05);
  if(walk.isLocked){
    const sp=(keys.ShiftLeft||keys.ShiftRight?7:3.2)*dt;
    const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0), r=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
    if(f) walk.moveForward(f*sp); if(r) walk.moveRight(r*sp);
    camera.position.y=1.75;
  } else orbit.update();
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
const qs=new URLSearchParams(location.search);
setView(qs.get('view')||'frente');
document.getElementById('load').remove();
if(qs.has('noui')){document.getElementById('ui').style.display='none';hint.style.display='none';}
frame();
window.__ready=true;
</script>
</body>
</html>
